<!doctype html>
<html lang="en" data-surface="staff">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Secure Bangla QR · Portal Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+Bengali:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --font:'Inter','Noto Sans Bengali',system-ui,-apple-system,'Segoe UI',sans-serif;
  --head:'Montserrat','Inter','Noto Sans Bengali',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
  --accent:#14935a; --accent-2:#0e7547; --accent-soft:#e3f4eb; --on-accent:#fff;
  --side:#052b52; --side-2:#0a3d70; --side-text:#a9c3de; --side-head:#7897bb;
  --bg:#f4f6f5; --surface:#fff; --surface-2:#f9faf9; --line:#e3e8e5; --line-2:#cdd5d1;
  --text:#101714; --text-2:#46524c; --text-3:#76827c;
  --ok:#14935a; --ok-bg:#e3f4eb; --warn:#9a5b00; --warn-bg:#fff2d9; --bad:#c4302b; --bad-bg:#fdeceb; --info:#1d5fb8; --info-bg:#e8f0fc;
  --c1:var(--accent); --c2:#8fd3b2;
  --shadow:0 1px 2px rgba(16,23,20,.04),0 4px 16px rgba(16,23,20,.04);
  --r:10px; --sw:244px;
}
html[data-surface="fi"]{
  --accent:#1c56c9; --accent-2:#1444a3; --accent-soft:#e6eefc; --on-accent:#fff;
  --side:#0a2f66; --side-2:#12428a; --side-text:#b3c8ec; --side-head:#84a0d2;
  --c2:#9db9ee;
}
@media (prefers-color-scheme:dark){
  html:not([data-theme="light"]){
    --bg:#0c0f0e; --surface:#141917; --surface-2:#181e1b; --line:#252d29; --line-2:#37413c;
    --text:#edf2ef; --text-2:#a8b4ae; --text-3:#78857e; --shadow:none;
    --accent:#2fc27f; --accent-2:#52d99a; --accent-soft:#12372a; --on-accent:#05130c; --side:#04162b; --side-2:#082440; --c2:#245e45;
    --ok:#3ccf8a; --ok-bg:#12372a; --warn:#f0b24d; --warn-bg:#3a2b0f; --bad:#ff7d78; --bad-bg:#3d1c1b; --info:#7db2ff; --info-bg:#172a46;
  }
  html[data-surface="fi"]:not([data-theme="light"]){--accent:#6a9bff;--accent-2:#8fb4ff;--accent-soft:#16294f;--on-accent:#06122b;--side:#060e22;--side-2:#0d1a3a;--c2:#2a4a8a}
}
html[data-theme="dark"]{
  --bg:#0c0f0e; --surface:#141917; --surface-2:#181e1b; --line:#252d29; --line-2:#37413c;
  --text:#edf2ef; --text-2:#a8b4ae; --text-3:#78857e; --shadow:none;
  --accent:#2fc27f; --accent-2:#52d99a; --accent-soft:#12372a; --on-accent:#05130c; --side:#04162b; --side-2:#082440; --c2:#245e45;
  --ok:#3ccf8a; --ok-bg:#12372a; --warn:#f0b24d; --warn-bg:#3a2b0f; --bad:#ff7d78; --bad-bg:#3d1c1b; --info:#7db2ff; --info-bg:#172a46;
}
html[data-theme="dark"][data-surface="fi"]{--accent:#6a9bff;--accent-2:#8fb4ff;--accent-soft:#16294f;--on-accent:#06122b;--side:#060e22;--side-2:#0d1a3a;--c2:#2a4a8a}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font);font-size:14px;line-height:20px;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
input,select,textarea{font:inherit;color:var(--text)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:12.5px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.muted{color:var(--text-3)} .t2{color:var(--text-2)} .r{text-align:right} .nowrap{white-space:nowrap}
.neg{color:var(--bad)} .pos{color:var(--ok)}
.grow{flex:1}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:var(--sw) minmax(0,1fr);min-height:100vh}
.side{background:var(--side);color:var(--side-text);padding:18px 14px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:11px;padding:2px 8px 20px;color:#fff}
.logo{width:36px;height:36px;border-radius:10px;background:#fff;display:grid;place-items:center;flex:none}
.logo svg{width:24px;height:24px}
.brand b{display:block;font-family:var(--head);font-size:14px;line-height:17px;letter-spacing:.01em}
.brand span{font-size:11.5px;color:var(--side-head)}
.nav-h{font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--side-head);padding:16px 12px 6px}
.nav a{display:flex;align-items:center;gap:11px;padding:0 12px;min-height:40px;border-radius:999px;font-weight:500;transition:background .12s,color .12s}
.nav a:hover{background:var(--side-2);color:#fff}
.nav a.on{background:var(--accent);color:var(--on-accent)}
.nav .badge{margin-left:auto;background:var(--bad);color:#fff;border-radius:999px;font-size:11px;font-weight:600;padding:0 7px;line-height:18px}
.side-foot{margin-top:auto;padding-top:14px;border-top:1px solid rgba(255,255,255,.09)}
.top{display:flex;align-items:center;gap:10px;padding:12px 28px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:8;min-height:64px}
.crumb{font-size:12px;color:var(--text-3)} .crumb a:hover{color:var(--accent)}
.top h1{font-size:16px;line-height:22px;margin:0;font-weight:650}
.search{display:flex;align-items:center;gap:8px;height:38px;padding:0 14px;border:1px solid var(--line);border-radius:999px;background:var(--surface-2);color:var(--text-3);min-width:260px}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.search input{border:0;background:none;outline:0;width:100%}
.ib{width:38px;height:38px;border-radius:999px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;position:relative;color:var(--text-2)}
.ib:hover{background:var(--surface-2);color:var(--text)}
.ib .dot{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--bad);border:2px solid var(--surface)}
.menu-btn{display:none}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--accent-soft);color:var(--accent-2);display:grid;place-items:center;font-weight:650;font-size:13px;flex:none}
.userbtn{display:flex;align-items:center;gap:10px;padding:3px 10px 3px 3px;border-radius:999px;border:1px solid transparent}
.userbtn:hover{background:var(--surface-2);border-color:var(--line)}
.userbtn strong{display:block;font-size:13px;line-height:16px;text-align:left}
.userbtn small{display:block;font-size:11.5px;color:var(--text-3);line-height:14px;text-align:left}
.pop{position:absolute;right:0;top:calc(100% + 8px);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.14);min-width:280px;z-index:30;overflow:hidden}
.pop .it{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.pop .it:last-child{border-bottom:0} .pop .it:hover{background:var(--surface-2)}
.pop .menu{display:flex;align-items:center;gap:10px;padding:10px 16px;width:100%;text-align:left}
.pop .menu:hover{background:var(--surface-2)}
.rel{position:relative}
.content{padding:28px;max-width:1360px}

/* ---------- primitives ---------- */
.ph{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start;justify-content:space-between;margin-bottom:22px}
.ph h2{font-family:var(--head);margin:0;font-size:24px;line-height:30px;font-weight:700;letter-spacing:-.015em;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.ph p{margin:6px 0 0;color:var(--text-2);max-width:68ch}
.acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 16px;border-radius:9px;border:1px solid var(--line-2);background:var(--surface);font-weight:550;white-space:nowrap;transition:background .12s,border-color .12s}
.btn:hover{background:var(--surface-2);border-color:var(--text-3)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.pri:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn.dng{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line-2))}
.btn.dng:hover{background:var(--bad-bg)}
.btn.dngf{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{height:30px;padding:0 11px;font-size:13px;border-radius:8px}
.btn.ghost{border-color:transparent;background:none}
.btn:disabled{opacity:.45;cursor:not-allowed}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.ch{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.ch h3{margin:0;font-size:15px;line-height:20px;font-weight:650}
.ch .sub{font-size:12.5px;color:var(--text-3)}
.pad{padding:20px}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-main{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr)}
.mb{margin-bottom:16px}
.kpi{padding:18px 20px}
.kpi small{display:flex;align-items:center;gap:8px;color:var(--text-3);font-size:12.5px;font-weight:550}
.kpi small .ico{width:26px;height:26px;border-radius:8px;background:var(--accent-soft);color:var(--accent-2);display:grid;place-items:center}
.kpi small .ico svg{width:15px;height:15px}
.kpi .v{font-size:26px;line-height:34px;font-weight:700;margin-top:10px;letter-spacing:-.02em}
.kpi .s{font-size:12.5px;color:var(--text-2);margin-top:2px}
.chip{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.ok{background:var(--ok-bg);color:var(--ok)} .chip.warn{background:var(--warn-bg);color:var(--warn)} .chip.bad{background:var(--bad-bg);color:var(--bad)} .chip.info{background:var(--info-bg);color:var(--info)}
.chip.plain::before{display:none}
.tag{display:inline-block;height:20px;line-height:20px;padding:0 8px;border-radius:6px;font-size:11.5px;font-weight:600;background:var(--surface-2);border:1px solid var(--line);color:var(--text-2)}
.banner{display:flex;gap:12px;padding:14px 16px;border-radius:12px;border:1px solid;margin-bottom:16px;align-items:flex-start}
.banner.warn{background:var(--warn-bg);border-color:color-mix(in srgb,var(--warn) 28%,transparent);color:var(--warn)}
.banner.info{background:var(--info-bg);border-color:color-mix(in srgb,var(--info) 28%,transparent);color:var(--info)}
.banner.bad{background:var(--bad-bg);border-color:color-mix(in srgb,var(--bad) 30%,transparent);color:var(--bad)}
.banner.ok{background:var(--ok-bg);border-color:color-mix(in srgb,var(--ok) 28%,transparent);color:var(--ok)}
.banner b{display:block;color:var(--text)} .banner div div{color:var(--text-2);font-size:13px;line-height:19px}
.banner a,.link{font-weight:600;text-decoration:underline;text-underline-offset:3px;color:inherit;cursor:pointer}
.link{color:var(--accent-2)}
.hero{display:flex;gap:20px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:22px 24px;border-radius:14px;background:linear-gradient(120deg,var(--side) 0%,var(--side-2) 100%);color:#fff;margin-bottom:16px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-80px;width:280px;height:280px;border-radius:50%;background:radial-gradient(closest-side,color-mix(in srgb,var(--accent) 55%,transparent),transparent)}
.hero h2{font-family:var(--head);margin:0;font-size:20px;line-height:26px;font-weight:650} .hero p{margin:4px 0 0;color:var(--side-text);max-width:56ch}
.hero .btn{position:relative;z-index:1}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{padding:10px 14px;font-weight:550;color:var(--text-2);border-bottom:2px solid transparent;white-space:nowrap;margin-bottom:-1px}
.tabs button:hover{color:var(--text)} .tabs button.on{color:var(--accent-2);border-color:var(--accent)}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line)}
.fld{display:flex;align-items:center;gap:8px;height:36px;padding:0 12px;border:1px solid var(--line-2);border-radius:9px;background:var(--surface);color:var(--text-3)}
.fld input,.fld select{border:0;background:none;outline:0;color:var(--text);min-width:0}
.fld:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 16%,transparent)}
.fld select{padding-right:4px;cursor:pointer}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:12px;font-weight:600;color:var(--text-3);text-align:left;padding:10px 20px;background:var(--surface-2);border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:13px 20px;border-bottom:1px solid var(--line);vertical-align:middle}
th.r,td.r{text-align:right}
tbody tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer} tbody tr.click:hover{background:var(--surface-2)}
tfoot td{font-weight:700;background:var(--surface-2);border-top:1px solid var(--line);border-bottom:0}
.two b{display:block} .two small{display:block;color:var(--text-3);font-size:12px}
.pager{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;padding:12px 20px;border-top:1px solid var(--line);color:var(--text-2);font-size:13px}
.pager .pg{display:flex;gap:4px}
.pager .pg button{min-width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:550}
.pager .pg button.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.pager .pg button:disabled{opacity:.4;cursor:not-allowed}
.empty{padding:48px 20px;text-align:center;color:var(--text-3)}
.empty b{display:block;color:var(--text);font-size:15px;margin-bottom:4px}
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden;min-width:80px} .bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.list .row{display:flex;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line);align-items:flex-start;width:100%;text-align:left}
.list .row:last-child{border-bottom:0} .list a.row:hover,.list button.row:hover{background:var(--surface-2)}
.list .ico{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;flex:none}
.ico.warn{background:var(--warn-bg);color:var(--warn)} .ico.info{background:var(--info-bg);color:var(--info)} .ico.ok{background:var(--ok-bg);color:var(--ok)} .ico.bad{background:var(--bad-bg);color:var(--bad)}
.legend{display:flex;gap:16px;font-size:12.5px;color:var(--text-2)} .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:10px 28px}
.kv dt{color:var(--text-3)} .kv dd{margin:0;font-weight:500;word-break:break-word}
.note{font-size:12.5px;color:var(--text-3);padding:12px 20px;border-top:1px solid var(--line)}
.sw{width:40px;height:22px;border-radius:99px;background:var(--line-2);position:relative;transition:background .15s;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s}
.sw[aria-checked="true"]{background:var(--accent)} .sw[aria-checked="true"]::after{transform:translateX(18px)}

/* ---------- forms / overlays ---------- */
.f{margin-bottom:16px}
.f label{display:block;font-size:12.5px;font-weight:600;color:var(--text-2);margin-bottom:6px}
.f input,.f select,.f textarea{width:100%;height:40px;border-radius:9px;border:1px solid var(--line-2);background:var(--surface);padding:0 12px;outline:0}
.f textarea{height:auto;min-height:96px;padding:10px 12px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 16%,transparent)}
.f.err input,.f.err select,.f.err textarea{border-color:var(--bad)}
.f .e{display:none;color:var(--bad);font-size:12.5px;margin-top:5px} .f.err .e{display:block}
.f .h{font-size:12.5px;color:var(--text-3);margin-top:5px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.scrim{position:fixed;inset:0;background:rgba(6,12,10,.55);z-index:40;animation:fade .15s}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(480px,100%);background:var(--surface);border-left:1px solid var(--line);z-index:41;display:flex;flex-direction:column;animation:slide .2s ease}
.drawer.wide{width:min(620px,100%)}
.drawer>header{display:flex;align-items:center;justify-content:space-between;padding:16px 22px;border-bottom:1px solid var(--line)}
.drawer>header h3{margin:0;font-size:16px}
.drawer .body{padding:22px;overflow:auto;flex:1}
.drawer>footer{padding:16px 22px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(460px,calc(100% - 32px));background:var(--surface);border:1px solid var(--line);border-radius:14px;z-index:41;padding:24px;animation:pop .15s ease;box-shadow:0 24px 60px rgba(0,0,0,.3)}
.modal h3{margin:0 0 8px;font-size:17px} .modal p{margin:0 0 20px;color:var(--text-2)}
.modal .acts{justify-content:flex-end}
.secret{display:flex;gap:8px;align-items:center;padding:12px;border-radius:9px;background:var(--surface-2);border:1px dashed var(--line-2);word-break:break-all}
.steps{display:flex;gap:8px;margin-bottom:22px}
.steps div{flex:1;height:4px;border-radius:9px;background:var(--line)} .steps div.on{background:var(--accent)}
.toasts{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--ok);color:#fff;padding:10px 18px;border-radius:999px;font-weight:600;display:flex;gap:8px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.2);animation:drop .25s ease}
.toast.bad{background:var(--bad)}
@keyframes fade{from{opacity:0}} @keyframes slide{from{transform:translateX(40px);opacity:0}} @keyframes pop{from{opacity:0;transform:translate(-50%,-48%)}} @keyframes drop{from{opacity:0;transform:translateY(-12px)}}

/* ---------- login ---------- */
.login{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}
.l-art{background:linear-gradient(150deg,var(--side) 0%,var(--side-2) 100%);color:#fff;padding:44px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.l-art::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:44px 44px;mask-image:radial-gradient(120% 90% at 20% 90%,#000,transparent 70%)}
.l-art>*{position:relative}
.l-art h2{font-family:var(--head);font-size:32px;line-height:42px;margin:0 0 14px;letter-spacing:-.02em;max-width:15ch}
.l-art p{color:var(--side-text);max-width:44ch;font-size:15px;line-height:23px;margin:0}
.l-art .pts{display:grid;gap:12px;margin-top:28px} .l-art .pts div{display:flex;gap:10px;align-items:center;color:#dbe8e1}
.l-art .pts svg{color:var(--accent)}
html[data-surface="fi"] .l-art .pts svg{color:#8fb4ff}
.l-form{display:grid;place-items:center;padding:32px;background:var(--bg)}
.l-card{width:min(420px,100%)}
.l-card h1{font-family:var(--head);font-size:26px;line-height:32px;margin:0 0 6px;letter-spacing:-.02em} .l-card>p{margin:0 0 22px;color:var(--text-2)}
.seg{display:grid;grid-template-columns:1fr 1fr;padding:4px;border-radius:11px;background:var(--line);margin-bottom:22px}
.seg button{height:36px;border-radius:8px;font-weight:600;color:var(--text-2)} .seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.pw{position:relative} .pw button{position:absolute;right:6px;top:4px;width:32px;height:32px;display:grid;place-items:center;color:var(--text-3)}
.demo{margin-top:26px;padding-top:18px;border-top:1px solid var(--line)}
.demo small{display:block;color:var(--text-3);margin-bottom:10px}
.demo .acts button{height:32px;padding:0 12px;border-radius:99px;border:1px solid var(--line-2);background:var(--surface);font-size:12.5px;font-weight:550}
.demo .acts button:hover{border-color:var(--accent);color:var(--accent-2)}
.chk{display:flex;align-items:center;gap:8px;color:var(--text-2)}

@media (max-width:1180px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g-main{grid-template-columns:1fr}.g3{grid-template-columns:1fr 1fr}}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)} .login{grid-template-columns:1fr} .l-art{display:none}
  .side{position:fixed;left:0;top:0;bottom:0;width:272px;z-index:50;transform:translateX(-100%);transition:transform .2s} .side.open{transform:none}
  .menu-btn{display:grid} .search{display:none} .content{padding:18px 16px} .top{padding:10px 16px}
  .userbtn div{display:none} .userbtn{padding:3px} .nav a{min-height:44px} .g2,.g3{grid-template-columns:1fr}
}
@media (max-width:560px){.g4{grid-template-columns:1fr}.ph h2{font-size:21px}.row2{grid-template-columns:1fr}.hero{padding:18px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

function barChart(data,opts={}){
 const W=640,H=230,pl=48,pr=8,pt=12,pb=28,iw=W-pl-pr,ih=H-pt-pb;const max=Math.max(...data.map(d=>d.a+d.b),1);const top=Math.ceil(max/4/(10**(String(Math.round(max)).length-2)))*(10**(String(Math.round(max)).length-2))*4||max;
 const bw=Math.min(54,iw/data.length*0.52);let g='';
 for(let i=0;i<=4;i++){const y=pt+ih-ih*i/4;g+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-dasharray="${i?'3 4':'0'}"/><text x="${pl-8}" y="${y+4}" text-anchor="end" font-size="11" fill="var(--text-3)">${opts.fmtAxis?opts.fmtAxis(top*i/4):compact(top*i/4)}</text>`}
 data.forEach((d,i)=>{const cx=pl+iw/data.length*(i+.5);const ha=ih*d.a/top,hb=ih*d.b/top;
  g+=`<g><title>${esc(d.label)}: ${esc(opts.aName||'Generations')} ${fmt(d.a)}, ${esc(opts.bName||'Validations')} ${fmt(d.b)}</title><rect x="${cx-bw/2}" y="${pt+ih-hb}" width="${bw}" height="${hb}" rx="3" fill="var(--c1)" opacity="${d.draft?.55:1}"/><rect x="${cx-bw/2}" y="${pt+ih-hb-ha}" width="${bw}" height="${ha}" rx="3" fill="var(--c2)" opacity="${d.draft?.55:1}"/></g><text x="${cx}" y="${H-8}" text-anchor="middle" font-size="11.5" fill="var(--text-3)">${esc(d.label)}</text>`});
 return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(opts.aria||'Chart')}" style="display:block">${g}</svg>`}
function pager(total,page,per,act){const pages=Math.max(1,Math.ceil(total/per));const from=total?(page-1)*per+1:0,to=Math.min(total,page*per);
 let b=`<button data-act="${act}" data-p="${page-1}" ${page<=1?'disabled':''} aria-label="Previous page">‹</button>`;
 const win=[];for(let p=1;p<=pages;p++)if(p===1||p===pages||Math.abs(p-page)<=1)win.push(p);let last=0;
 win.forEach(p=>{if(p-last>1)b+='<button disabled>…</button>';b+=`<button class="${p===page?'on':''}" data-act="${act}" data-p="${p}" ${p===page?'aria-current="page"':''}>${p}</button>`;last=p});
 b+=`<button data-act="${act}" data-p="${page+1}" ${page>=pages?'disabled':''} aria-label="Next page">›</button>`;
 return `<div class="pager"><span>Showing <b class="num">${from}–${to}</b> of <b class="num">${fmt(total)}</b></span><div class="pg">${b}</div></div>`}
function pageHead(title,sub,acts='',extra=''){return `<div class="ph"><div><h2>${title}${extra}</h2>${sub?`<p data-pretext>${sub}</p>`:''}</div><div class="acts">${acts}</div></div>`}

/* QR inspector: real EMV TLV parse + CRC16 */
function crc16(str){let c=0xFFFF;for(let i=0;i<str.length;i++){c^=str.charCodeAt(i)<<8;for(let j=0;j<8;j++)c=(c&0x8000)?((c<<1)^0x1021)&0xFFFF:(c<<1)&0xFFFF}return c.toString(16).toUpperCase().padStart(4,'0')}
const tlv=(id,v)=>id+String(v.length).padStart(2,'0')+v;
function buildQR(kind){let s=tlv('00','01')+tlv('01',kind==='static'?'11':'12')+tlv('26',tlv('00','bd.gov.bb.bqr')+tlv('01','SHB0000123456')+tlv('02','2087'))+tlv('52','5411')+tlv('53','050')+(kind==='dynamic'?tlv('54','1250.00'):'')+tlv('58','BD')+tlv('59','Mohakhali Fresh Mart')+tlv('60','Dhaka')+tlv('62',tlv('05',kind==='dynamic'?'INV-30417':'STORE01'));s+='6304';return s+crc16(s)}
function parseTLV(s){const out=[];let i=0;while(i<s.length){const id=s.substr(i,2),len=parseInt(s.substr(i+2,2),10);if(!/^\d{2}$/.test(id)||isNaN(len)||i+4+len>s.length)throw new Error('Malformed TLV near position '+i);out.push({id,len,val:s.substr(i+4,len)});i+=4+len}return out}
const TAGN={'00':'Payload format indicator','01':'Point of initiation','52':'Merchant category code','53':'Currency (050 = BDT)','54':'Transaction amount','58':'Country code','59':'Merchant name','60':'Merchant city','62':'Additional data','63':'CRC'};
function inspectQR(raw){const s=raw.trim();const res={ok:true,rows:[],checks:[]};
 try{if(!s)throw new Error('Paste a QR payload first.');const top=parseTLV(s);
  top.forEach(t=>{const nm=(+t.id>=26&&+t.id<=51)?'Merchant account information':TAGN[t.id]||'Tag '+t.id;let val=t.val;
   if(t.id==='01')val+=t.val==='11'?' · static':t.val==='12'?' · dynamic':'';
   res.rows.push({id:t.id,name:nm,len:t.len,val,lvl:0});
   if((+t.id>=26&&+t.id<=51)||t.id==='62'){safe(()=>parseTLV(t.val).forEach(n=>res.rows.push({id:t.id+'.'+n.id,name:t.id==='62'?({'05':'Reference label','01':'Bill number'}[n.id]||'Sub-tag '+n.id):({'00':'Globally unique id','01':'Account / merchant id','02':'Terminal id'}[n.id]||'Sub-tag '+n.id),len:n.len,val:n.val,lvl:1})),0)}});
  const last=top[top.length-1];const crcOk=last&&last.id==='63'&&last.len===4&&crc16(s.slice(0,-4))===last.val.toUpperCase();
  res.checks.push([top[0]&&top[0].id==='00','Starts with payload format indicator (00)']);
  res.checks.push([!!last&&last.id==='63','Ends with CRC tag (63)']);
  res.checks.push([crcOk,'CRC-16/CCITT matches'+(last&&last.id==='63'&&!crcOk?` (expected ${crc16(s.slice(0,-4))}, found ${last.val})`:'')]);
  res.checks.push([top.some(t=>t.id==='53'&&t.val==='050'),'Currency is BDT (050)']);
  res.checks.push([top.some(t=>t.id==='58'&&t.val==='BD'),'Country is BD']);
 }catch(e){res.ok=false;res.err=e.message}return res}

 const o=ui().qrOut;
 return pageHead('QR inspector','Decode a Bangla QR payload (EMV TLV) and check its structure and CRC. Everything runs in your browser; nothing is sent to the server.')+

function doLogin(){
 const u=$('#lu').value.trim(),p=$('#lp').value;S.lu=u;S.lp='';fieldErr('lu',u?'':'Enter your user ID.');fieldErr('lp',p?'':'Enter your password.');if(!u||!p)return;

   go.onclick=()=>{const q=D.late.filter(l=>l.status==='Queued').length;if(q){$('#finErr').innerHTML=`<div class="banner bad" role="alert">${ic('warn')}<div><b>409 · USAGE_NOT_COMPLETE</b><div>${q} usage events have not been delivered. Requeue them in <a data-act="goto" data-h="#/staff/reports">Reports</a>, then try again.</div></div></div>`;return}
    D.periodMeta[p]={status:'Finalized',by:S.user.id,at:NOW};D.adj.filter(a=>a.period===p).forEach(a=>a.status='Applied');closeOverlay();render();toast(monthName(p)+' finalized')}}})},

function popup(el,html){const host=el.closest('.rel');const had=host.querySelector('.pop');$$('.pop').forEach(p=>p.remove());if(had)return;host.insertAdjacentHTML('beforeend',html)}
function wizard(step){const w=S.wiz||{};
 openDrawer({title:'Add institution',wide:true,body:`<div class="steps"><div class="on"></div><div class="${step===2?'on':''}"></div></div>`+(step===1?`<div class="f"><label for="wn">Organisation name</label><input id="wn" value="${esc(w.name||'')}"><div class="e"></div></div><div class="row2"><div class="f"><label for="wt">Organisation type</label><select id="wt">${['Commercial bank','Islamic bank','Digital bank','Co-operative bank','Payment service provider'].map(t=>`<option ${w.type===t?'selected':''}>${t}</option>`).join('')}</select></div><div class="f"><label for="wp">Phone</label><input id="wp" value="${esc(w.phone||'')}" placeholder="+880 …"></div></div><div class="row2"><div class="f"><label for="wc">Technical contact</label><input id="wc" value="${esc(w.contact||'')}"><div class="e"></div></div><div class="f"><label for="we">Contact email</label><input id="we" type="email" value="${esc(w.email||'')}"><div class="e"></div></div></div><div class="f"><label for="wa">Address</label><input id="wa" value="${esc(w.addr||'')}"></div>`
  :`<div class="f"><label for="wdt">Document type</label><select id="wdt"><option>Trade licence</option><option>Bangladesh Bank approval letter</option><option>Authorised signatory list</option></select></div><div class="f"><label>Upload document</label><button type="button" class="btn" id="wd" data-act="fakeFile" style="width:100%;height:84px;border-style:dashed;flex-direction:column">${ic('up')} Choose a file to upload<span class="muted" style="font-weight:400">PDF up to 10 MB</span></button><div class="e"></div></div><p class="muted">The institution is created as <b>Pending</b>. Activate it after verifying documents and provisioning a credential.</p>`),
  footer:step===1?`<button class="btn" data-act="close">Cancel</button><button class="btn pri" data-act="wizNext">Next ${ic('chev')}</button>`:`<button class="btn" data-act="wizBack">Back</button><button class="btn pri" data-act="wizSubmit">Create institution</button>`})}

document.addEventListener('click',e=>{
 const el=e.target.closest('[data-act]');
 if(!e.target.closest('.rel'))$$('.pop').forEach(p=>p.remove());
 if(!el)return;const a=A[el.dataset.act];if(a){if(el.tagName==='A'&&el.getAttribute('href')==='#')e.preventDefault();a(el,e)}});
document.addEventListener('input',e=>{const k=e.target.dataset&&e.target.dataset.in;if(!k)return;handleIn(k,e.target)});
document.addEventListener('change',e=>{const k=e.target.dataset&&e.target.dataset.in;if(!k||e.target.tagName==='INPUT'&&e.target.type==='text')return;handleIn(k,e.target)});
function handleIn(k,t){
 if(k==='qrText'){ui().qrText=t.value;return}
 ui()[k]=t.value;if(k.startsWith('usage'))ui().usagePage=1;render()}
document.addEventListener('keydown',e=>{
 if(e.key==='Enter'&&e.target.id==='gsearch'){const v=e.target.value.trim();if(S.user.surface==='fi'){ui().usageQ=v;ui().usagePage=1;go('#/fi/usage');render()}else{ui().instQ=v;go('#/staff/institutions');render()}}
 if(e.key==='Enter'&&e.target.id==='fu')A.sendReset();
});
render();
})();
